name: Test trusted contract

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.lock"
      - ".github/workflows/**"
  pull_request_target:
    paths:
      - "contracts/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          # Senza questa riga il job non parte proprio. `cache: pip` cerca da sé
          # `**/requirements.txt` o `**/pyproject.toml`, e questo repository non
          # ha né l'uno né l'altro: le dipendenze stanno in `requirements.lock`,
          # che quel glob non nomina. `setup-python` non degrada — esce con
          # «No file ... matched», e il job muore prima di installare qualsiasi
          # cosa.
          #
          # Il risultato è che questa pipeline non ha **mai** eseguito un test:
          # rossa a ogni push su `main` dal 19 agosto 2026, quando è stata
          # scritta. È la suite che difende `/contracts/`, `/scripts/` e
          # `/tests/`, cioè le tre directory che `CODEOWNERS` protegge.
          #
          # Gli altri due workflow lo dichiaravano già, con il percorso dentro
          # `validator/` perché là il checkout fidato va in quella directory. Qui
          # il checkout è alla radice, quindi il percorso è quello.
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -p 'test_*.py'
