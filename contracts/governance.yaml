schema_version: "1.0"

voting:
  window_days: 7
  minimum_eligible_votes: 5
  minimum_reviewer_approvals: 2
  minimum_maintainer_approvals: 1
  eligible_author_associations:
    - OWNER
    - MEMBER
    - COLLABORATOR
    - CONTRIBUTOR
  block_on_changes_requested: true
  reset_on_new_commit: true
  automatic_merge: false

limits:
  maximum_observations: 250000
  maximum_observations_bytes: 26214400
  maximum_metadata_bytes: 262144
  maximum_provenance_bytes: 262144

managed_batches:
  # A batch carries one provider. Each one has its pinned configuration and
  # provenance schema, copied from the core with the lock above.
  providers:
    Eurostat:
      config: eurostat-datasets.json
      provenance_schema: eurostat-provenance.schema.json
    JRC:
      config: jrc-datasets.json
      provenance_schema: jrc-provenance.schema.json
  channel: managed_public
  maximum_datasets: 20
  # Per release. The 250,000 under `limits` is the community lane's: two dozen
  # published Eurostat releases exceed it (population-structure has 1,032,709
  # rows), and applied here it rejected any batch that refreshed one of them.
  # The batch totals below are what bounds the managed lane.
  maximum_release_observations: 2000000
  maximum_total_observations: 2000000
  maximum_total_bytes: 104857600
